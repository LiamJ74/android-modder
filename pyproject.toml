[project]
name = "android-modder"
version = "0.1.0"
description = "Tools, skills and a shared knowledge base for AI agents that mod Android games the user owns: APK recon, apktool/sign/install, adb capture and input, app-data backups, fal asset generation, mobile sprite pipelines, field notes."
readme = "README.md"
license = "MIT"
authors = [{ name = "LiamJ74" }]
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "pillow>=10",
    "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
am = "am.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["am"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]  # typer declares options as default arguments

[tool.pytest.ini_options]
testpaths = ["tests"]
