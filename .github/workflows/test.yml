name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@v5
      - name: Set up Python
        run: uv python install 3.12
      - name: Install
        run: uv pip install --system -e ".[dev]"
      - name: Lint
        run: ruff check am
      - name: Tests
        run: pytest -q
      - name: Knowledge base is valid and indexed
        run: python -m am kb check --index
      - name: Self-lint (publish check on the repo)
        run: python -m am publish check .
